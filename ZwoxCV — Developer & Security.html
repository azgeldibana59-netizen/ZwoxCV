function buildRadar(){
 const N=skills.length,R=38,cx=50,cy=50;
 const ang=i=>(-90+i*360/N)*Math.PI/180;
 const pt=(i,v)=>[cx+(v/100)*R*Math.cos(ang(i)),cy+(v/100)*R*Math.sin(ang(i))];
 const poly=skills.map((s,i)=>pt(i,s[2]).join(",")).join(" ");
 const gridPolys=[25,50,75,100].map(p=>`<polygon class="grid" points="${skills.map((s,i)=>pt(i,p).join(",")).join(" ")}"/>`).join("");
 const labels=skills.map((s,i)=>{const[x,y]=pt(i,122);return `<text x="${x}" y="${y}" text-anchor="middle" dominant-baseline="middle">${s[0]}</text>`}).join("");
 return `<svg viewBox="0 0 100 100">${gridPolys}<polygon points="${poly}"/>${labels}</svg>`;
}

 document.getElementById("pr").innerHTML=projects.map((p,i)=>`<div class="card rv" data-i="${i}"><div class="icn">${p[1]}</div><b>0${i+1}</b><h3>${p[0]}</h3></div>`).join("");

// ---- sound effects (synthesized, no external files) ----
let actx;
function beep(freq,dur){
 if(!soundOn)return;
 try{
  if(!actx)actx=new (window.AudioContext||window.webkitAudioContext)();
  const o=actx.createOscillator(),g=actx.createGain();
  o.type="sine";o.frequency.value=freq;g.gain.value=.05;
  o.connect(g);g.connect(actx.destination);
  g.gain.exponentialRampToValueAtTime(.0001,actx.currentTime+dur);
  o.start();o.stop(actx.currentTime+dur);
 }catch(e){}
}

// ---- click burst particles ----
addEventListener("pointerdown",e=>{
 if(e.target.closest("input,textarea,.cform")) return;
 for(let i=0;i<(PERF?3:7);i++){

 }

const visited=new Set();let achieved=false;
function trackVisit(id){
 if(!id||achieved)return;
 visited.add(id);
 if(visited.size>=document.querySelectorAll("section.blk").length){achieved=true;toast(I18N.achieve[lang]);beep(880,.08)}

addEventListener("keydown",e=>{
 kPos=(e.key===KONAMI[kPos])?kPos+1:0;
 if(kPos===KONAMI.length){kPos=0;runTerm()}

function runTerm(){
 const term=document.getElementById("term");
 const lines=lang?["> initializing session...","> user: guest","> access: granted","> welcome to zwoxcv.sh","> have a good day. ✦"]:["> oturum başlatılıyor...","> kullanıcı: ziyaretçi","> erişim: onaylandı","> zwoxcv.sh'a hoş geldin","> iyi günler. ✦"];
 term.classList.add("on");term.textContent="";
 let i=0;
 const iv=setInterval(()=>{term.textContent+=lines[i]+"\n";i++;if(i>=lines.length){clearInterval(iv);setTimeout(()=>term.classList.remove("on"),2200)}},350);
 beep(800,.06);

// mouse
const M={x:innerWidth/2,y:innerHeight/2,sx:innerWidth/2,sy:innerHeight/2};
const glow=document.getElementById("glow");
addEventListener("pointermove",e=>{M.x=e.clientX;M.y=e.clientY});

// ---- performance mode: auto-detect low-power devices, plus a manual override ----
let PERF=false;
try{PERF=localStorage.getItem("zc_perf")==="1"}catch(e){}
const autoLow=innerWidth<768||(navigator.hardwareConcurrency&&navigator.hardwareConcurrency<=4)||matchMedia("(prefers-reduced-motion: reduce)").matches;
if(!PERF)PERF=autoLow;
function dpr(){return PERF?1:Math.min(devicePixelRatio||1,2)}
const perfBtn=document.getElementById("perfBtn");
function setPerfUI(){perfBtn.classList.toggle("cur",PERF);perfBtn.style.color=PERF?"var(--ac)":"";document.documentElement.classList.toggle("perf",PERF)}
perfBtn.addEventListener("click",()=>{PERF=!PERF;try{localStorage.setItem("zc_perf",PERF?"1":"0")}catch(e){}setPerfUI();rs();rb();beep(500,.03)});
setPerfUI();

// background particles reacting to mouse
const bg=document.getElementById("bg"),bx=bg.getContext("2d");
let W,H,P=[];
function rs(){const d=dpr();W=bg.width=innerWidth*d;H=bg.height=innerHeight*d;bx.setTransform(d,0,0,d,0,0);W=innerWidth;H=innerHeight;
 const cap=PERF?45:140;
 P=Array.from({length:Math.min(cap,Math.floor(W*H/9000))},()=>({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.3,vy:(Math.random()-.5)*.3,r:Math.random()*1.4+.4}))}
addEventListener("resize",rs);rs();

// black hole
const bh=document.getElementById("bh"),c=bh.getContext("2d");
let bw,bhh;function rb(){const d=dpr();bh.width=innerWidth*d;bh.height=innerHeight*d;c.setTransform(d,0,0,d,0,0);bw=innerWidth;bhh=innerHeight}
addEventListener("resize",rb);rb();

// pause rendering entirely when the tab isn't visible, to save battery/CPU
let RUNNING=true;
document.addEventListener("visibilitychange",()=>{RUNNING=!document.hidden;if(RUNNING)requestAnimationFrame(frame)});
const hero=document.getElementById("hero"),stick=document.querySelector(".stick"),navEl=document.getElementById("nav"),progEl=document.getElementById("prog"),hintEl=document.getElementById("hint"),totopEl=document.getElementById("totop");
totopEl.addEventListener("click",()=>{scrollTo({top:0,behavior:"smooth"});beep(560,.03)});
let prog=0,tp=0,pinDist=1;
// measure the EXACT pixel distance the hero stays pinned for (hero height minus sticky panel height),
// using real rendered element sizes rather than vh math, so it always matches native sticky release.
function measure(){pinDist=Math.max(1,hero.offsetHeight-stick.offsetHeight)}
function upd(){
 const r=hero.getBoundingClientRect();
 tp=Math.min(1,Math.max(0,-r.top/pinDist));
 const docH=document.documentElement.scrollHeight-innerHeight;
 progEl.style.width=(docH>0?Math.min(100,(scrollY/docH)*100):0)+"%";
 navEl.classList.toggle("on",scrollY>innerHeight*.6);
 totopEl.classList.toggle("on",scrollY>innerHeight*1.2);
 if(hintEl)hintEl.style.opacity=tp>.05?0:1;
 let cur=null;document.querySelectorAll("section.blk").forEach(s=>{if(s.getBoundingClientRect().top<innerHeight*.4)cur=s.id});
 navEl.querySelectorAll("a").forEach(a=>a.classList.toggle("cur",a.getAttribute("href")==="#"+cur));
 trackVisit(cur);
}
addEventListener("scroll",upd,{passive:true});
addEventListener("resize",measure);
measure();upd();
document.querySelectorAll('nav a').forEach(a=>a.addEventListener('click',e=>{e.preventDefault();document.querySelector(a.getAttribute('href')).scrollIntoView({behavior:'smooth'})}));
const D=Array.from({length:PERF?700:2000},()=>{const k=Math.random();return{r:1.3+Math.pow(k,1.7)*2.3,a:Math.random()*6.283,s:.3+Math.random()*.45,z:Math.random()*1.7+.4,h:12+k*34+(Math.random()*16)}});
const STARS=Array.from({length:PERF?80:220},()=>({x:Math.random(),y:Math.random(),r:Math.random()*1.3+.2,tw:Math.random()*6.283,sp:.5+Math.random()*1.5}));
let T=0;
function frame(){
 T+=.016;prog+=(tp-prog)*.08;
 M.sx+=(M.x-M.sx)*.12;M.sy+=(M.y-M.sy)*.12;
 glow.style.left=M.sx+"px";glow.style.top=M.sy+"px";
 // bg
 bx.clearRect(0,0,W,H);
 for(const p of P){
  const dx=M.sx-p.x,dy=M.sy-p.y,d=Math.hypot(dx,dy);
  if(d<220){p.vx+=dx/d*.02;p.vy+=dy/d*.02}
  p.vx*=.985;p.vy*=.985;p.x+=p.vx+(Math.random()-.5)*.05;p.y+=p.vy+(Math.random()-.5)*.05;
  if(p.x<0)p.x=W;if(p.x>W)p.x=0;if(p.y<0)p.y=H;if(p.y>H)p.y=0;
  bx.fillStyle=d<220?"rgba(255,160,80,.9)":"rgba(190,190,255,.5)";
  bx.beginPath();bx.arc(p.x,p.y,p.r,0,6.283);bx.fill();
  if(d<160){bx.strokeStyle=`rgba(255,138,43,${(1-d/160)*.4})`;bx.beginPath();bx.moveTo(p.x,p.y);bx.lineTo(M.sx,M.sy);bx.stroke()}
 }
 // black hole
 const cx=bw/2+(M.sx-bw/2)*.02,cy=bhh*.42+(M.sy-bhh/2)*.02,R=Math.min(bw,bhh)*.12;
 c.clearRect(0,0,bw,bhh);
 const rot=prog*Math.PI*2; // exactly one full turn across scroll
 const tilt=.32;

 // deep space starfield with parallax + twinkle
 for(const s of STARS){
  const px=s.x*bw+(M.sx-bw/2)*-.015,py=s.y*bhh+(M.sy-bhh/2)*-.015;
  const tw=.4+.6*Math.abs(Math.sin(T*s.sp+s.tw));
  c.fillStyle=`rgba(210,215,255,${tw*.55})`;
  c.beginPath();c.arc(((px%bw)+bw)%bw,((py%bhh)+bhh)%bhh,s.r,0,6.283);c.fill();
 }

 // outer ambient halo
 let g=c.createRadialGradient(cx,cy,R*.5,cx,cy,R*5.2);
 g.addColorStop(0,"rgba(255,150,60,.22)");g.addColorStop(.35,"rgba(140,100,255,.11)");g.addColorStop(1,"transparent");
 c.fillStyle=g;c.fillRect(0,0,bw,bhh);

 // accretion disk particles with doppler beaming (approaching side brighter/bluer, receding side dimmer/redder)
 const draw=front=>{for(const p of D){
  const a=p.a+rot*p.s*(2.3/p.r)+T*.22*p.s*(2.3/p.r);
  const s=Math.sin(a);if((s>0)!==front)continue;
  const x=cx+Math.cos(a)*p.r*R,y=cy+s*p.r*R*tilt;
  const heat=1-(p.r-1.3)/2.3;
  const approach=(Math.cos(a)+1)/2; // 1 = approaching (left), 0 = receding
  const hue=p.h+approach*25;
  const light=48+heat*34+approach*14;
  const alpha=(.22+heat*.55)*(.7+approach*.6);
  c.fillStyle=`hsla(${hue},100%,${light}%,${alpha})`;
  c.beginPath();c.arc(x,y,p.z*(.55+heat)*(.8+approach*.5),0,6.283);c.fill();
 }};
 draw(false);

 // lensed arcs — light bent around the far side of the disk, top and bottom
 c.save();c.globalCompositeOperation="lighter";
 for(let i=0;i<4;i++){
  const rr=R*(1.3+i*.22);
  c.strokeStyle=`rgba(255,${160+i*22},${70+i*40},${.32-i*.065})`;c.lineWidth=2.2-i*.4;
  c.beginPath();c.ellipse(cx,cy,rr,rr*.9,0,Math.PI*1.03,Math.PI*1.97);c.stroke();
  c.globalAlpha=.45;
  c.beginPath();c.ellipse(cx,cy,rr,rr*.48,0,.04,Math.PI-.04);c.stroke();
  c.globalAlpha=1;
 }
 c.restore();

 // photon ring glow
 c.save();c.globalCompositeOperation="lighter";
 let pr=c.createRadialGradient(cx,cy,R*.92,cx,cy,R*1.18);
 pr.addColorStop(0,"rgba(0,0,0,0)");pr.addColorStop(.55,"rgba(255,210,150,.55)");pr.addColorStop(1,"rgba(255,210,150,0)");
 c.fillStyle=pr;c.beginPath();c.arc(cx,cy,R*1.18,0,6.283);c.fill();
 c.restore();

 // event horizon — pure black shadow
 c.fillStyle="#000";c.beginPath();c.arc(cx,cy,R*1.0,0,6.283);c.fill();
 c.strokeStyle="rgba(255,215,170,.95)";c.lineWidth=1.4;c.shadowColor="#ffb25e";c.shadowBlur=22;
 c.beginPath();c.arc(cx,cy,R*1.01,0,6.283);c.stroke();c.shadowBlur=0;

 draw(true);
 if(RUNNING)requestAnimationFrame(frame)}
frame();
</script>
